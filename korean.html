<!DOCTYPE html>
<html lang="en" data-theme="death-note">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beyond Birthday Archive — Off-Encora Korean Masters</title>
  
  <link rel="icon" type="image/png" href="snake-apple.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  
  <!-- Base & Reskin Styles (Matches Main Page Exactly) -->
  <link rel="stylesheet" href="style.css?v=8.0" />
  <link rel="stylesheet" href="halloween.css?v=1.0" />

  <style>
    body {
      background-color: #040102 !important;
      color: #ffffff !important;
      font-family: monospace, 'Courier New', sans-serif !important;
      min-height: 100vh !important;
      padding: 30px 15px !important;
    }

    .bb-page-container {
      max-width: 1000px !important;
      margin: 0 auto !important;
    }

    .bb-header {
      text-align: center !important;
      margin-bottom: 30px !important;
    }

    .bb-eye-logo {
      width: 75px !important;
      height: 75px !important;
      object-fit: contain !important;
      filter: drop-shadow(0 0 12px rgba(255, 0, 51, 0.85)) !important;
      margin-bottom: 12px !important;
      transition: transform 0.3s ease !important;
    }

    .bb-eye-logo:hover {
      transform: scale(1.1) rotate(5deg) !important;
    }

    .bb-title {
      color: #ff3344 !important;
      font-family: 'Cinzel', serif !important;
      font-size: 1.8rem !important;
      letter-spacing: 2px !important;
      margin: 0 0 8px 0 !important;
      text-shadow: 0 0 12px rgba(255, 0, 51, 0.7) !important;
    }

    .bb-subtitle {
      color: #00d8ff !important;
      font-style: italic !important;
      font-size: 0.88rem !important;
      margin-bottom: 20px !important;
    }

    .return-btn {
      display: inline-block !important;
      background: rgba(255, 0, 51, 0.12) !important;
      border: 1px solid #ff0033 !important;
      color: #ff3344 !important;
      padding: 8px 18px !important;
      border-radius: 4px !important;
      text-decoration: none !important;
      font-size: 0.82rem !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
      transition: all 0.25s ease !important;
      margin-bottom: 25px !important;
    }

    .return-btn:hover {
      background: #ff0033 !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px rgba(255, 0, 51, 0.9) !important;
    }

    .bb-table-card {
      background: #080204 !important;
      border: 1px solid #ff0033 !important;
      border-bottom: 3px solid #00d8ff !important;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.35) !important;
      border-radius: 8px !important;
      padding: 20px !important;
      overflow-x: auto !important;
    }

    table {
      width: 100% !important;
      border-collapse: collapse !important;
      font-size: 0.82rem !important;
      text-align: left !important;
    }

    th {
      background: rgba(255, 0, 51, 0.25) !important;
      color: #00d8ff !important;
      border-bottom: 2px solid #ff0033 !important;
      padding: 12px 10px !important;
      letter-spacing: 0.8px !important;
      text-transform: uppercase !important;
      white-space: nowrap !important;
    }

    td {
      border-bottom: 1px solid rgba(255, 0, 51, 0.18) !important;
      padding: 12px 10px !important;
      color: #dddddd !important;
      line-height: 1.4 !important;
      vertical-align: top !important;
    }

    tr:hover td {
      background: rgba(255, 0, 51, 0.08) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>

  <div class="bb-page-container">
    <div class="bb-header">
      <img src="art/B_cover_eye-removebackgrounds-ai.png" alt="Beyond Birthday Eye" class="bb-eye-logo">
      <h1 class="bb-title">BEYOND BIRTHDAY ARCHIVE</h1>
      <div class="bb-subtitle">"Records kept beyond Encora's database..." — Off-Encora Korean Masters</div>
      <a href="index.html" class="return-btn">← RETURN TO MAIN TRADING COLLECTION</a>
    </div>

    <div class="bb-table-card">
      <table>
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5">Accessing archive...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadKoreanCSV() {
      try {
        const response = await fetch('korean.csv');
        const csvText = await response.text();
        const lines = csvText.trim().split('\n');

        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]);
        document.getElementById('tableHeader').innerHTML = headers.map(h => `<th>${h.trim()}</th>`).join('');

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = parseCSVLine(lines[i]);
          const tr = document.createElement('tr');
          tr.innerHTML = cols.map(c => `<td>${c.trim()}</td>`).join('');
          tbody.appendChild(tr);
        }
      } catch (err) {
        console.error('CSV load error:', err);
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">Failed to load korean.csv</td></tr>';
      }
    }

    function parseCSVLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) {
          values.push(current);
          current = '';
        } else current += char;
      }
      values.push(current);
      return values;
    }

    document.addEventListener('DOMContentLoaded', loadKoreanCSV);
  </script>
</body>
</html>
